<!-- Message center page. -->
<section class="message-center" id="messageCenter">
<div class="message-shell">
<aside class="message-sidebar">
<div class="message-sidebar-head">
<h3>HOLO MESSAGES</h3>
<small>ALL CONTACT CHANNELS</small>
<div class="message-tabs">
<button class="message-tab active" data-msg-tab="All">ALL</button>
<button class="message-tab" data-msg-tab="Soaring Lights">SOARING</button>
<button class="message-tab" data-msg-tab="Whispering Shadows">SHADOWS</button>
<button class="message-tab" data-msg-tab="Groups">GROUPS</button>
</div>
<input class="message-search" id="messageSearch" placeholder="Search messages...">
</input></div>
<div class="message-contact-list" id="messageContacts"></div>
</aside>
<section class="message-thread">
<header class="thread-head">
<div class="thread-person">
<div class="m-avatar" id="threadAvatar">MS</div>
<div><h4 id="threadName">Mar Sunshine</h4><small id="threadStatus">SECURE CHANNEL • ONLINE</small><div class="group-members-line" id="groupMembersLine"></div></div>
</div>
<button class="message-close" id="messageClose">×</button>
</header>
<div class="thread-body" id="threadBody"></div>
<div class="thread-compose">
<input id="messageInput" placeholder="Type a holographic message..."/>
<button id="messageSend">SEND</button>
</div>
</section>
</div>
</section>
